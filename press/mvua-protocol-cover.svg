<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1672 941" width="1672" height="941">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06172A"/>
      <stop offset="55%" stop-color="#12324E"/>
      <stop offset="100%" stop-color="#245B80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.66" r="0.45">
      <stop offset="0%" stop-color="#E0A54F" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#E0A54F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E0A54F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E5E3F"/>
      <stop offset="100%" stop-color="#1D4130"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E8A3E"/>
      <stop offset="100%" stop-color="#2C5A2B"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4E7E"/>
      <stop offset="55%" stop-color="#2E86C1"/>
      <stop offset="100%" stop-color="#5AB0E4"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A5C7A"/>
      <stop offset="100%" stop-color="#1C3A55"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06172A" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#06172A" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#06172A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rain" width="46" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="8" y1="0" x2="8" y2="26" stroke="#8FCBF0" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
      <line x1="31" y1="34" x2="31" y2="58" stroke="#8FCBF0" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </pattern>
    <linearGradient id="rainMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="rainFade"><rect x="0" y="0" width="1672" height="941" fill="url(#rainMask)"/></mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- One maize plant: stalk, leaves and a cob. -->
    <symbol id="maize" viewBox="0 0 40 120" overflow="visible">
      <path d="M20 120 C 20 80 21 40 20 0" stroke="#7DB84A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M20 90 C 6 80 2 70 -6 66 C 6 68 14 74 20 82 Z" fill="#6AA63F"/>
      <path d="M20 72 C 34 62 40 52 48 48 C 36 52 28 58 20 64 Z" fill="#8CC456"/>
      <path d="M20 50 C 8 40 4 30 -2 24 C 8 28 16 36 20 44 Z" fill="#6AA63F"/>
      <path d="M20 30 C 30 22 34 14 40 8 C 30 12 24 18 20 24 Z" fill="#8CC456"/>
      <ellipse cx="25" cy="60" rx="4.5" ry="11" fill="#E0A54F" transform="rotate(18 25 60)"/>
    </symbol>
  </defs>

  <!-- Sky, dawn glow behind the farm, storm clouds and rain. -->
  <rect width="1672" height="941" fill="url(#sky)"/>
  <rect width="1672" height="941" fill="url(#glow)"/>
  <g mask="url(#rainFade)">
    <rect x="980" y="150" width="692" height="560" fill="url(#rain)"/>
  </g>
  <g fill="url(#cloud)">
    <ellipse cx="1180" cy="150" rx="170" ry="70"/>
    <ellipse cx="1330" cy="120" rx="190" ry="95"/>
    <ellipse cx="1500" cy="155" rx="200" ry="80"/>
    <ellipse cx="1620" cy="120" rx="140" ry="85"/>
    <ellipse cx="1260" cy="190" rx="200" ry="55"/>
    <ellipse cx="1480" cy="205" rx="230" ry="55"/>
  </g>
  <g fill="#5A7C98" opacity="0.55">
    <ellipse cx="1300" cy="95" rx="120" ry="40"/>
    <ellipse cx="1520" cy="115" rx="110" ry="35"/>
  </g>

  <!-- Back hills and the farm. -->
  <path d="M0 640 C 260 590 520 610 760 600 C 1000 590 1240 560 1672 600 L1672 941 L0 941 Z" fill="url(#hillBack)"/>
  <path d="M0 700 C 300 660 620 680 900 670 C 1180 660 1420 640 1672 655 L1672 941 L0 941 Z" fill="url(#field)"/>
  <g stroke="#3B6E31" stroke-width="5" fill="none" opacity="0.8">
    <path d="M0 760 C 400 728 900 735 1672 712"/>
    <path d="M0 820 C 420 790 920 796 1672 772"/>
    <path d="M0 885 C 440 856 940 860 1672 838"/>
  </g>
  <!-- Maize rows, smaller toward the horizon. -->
  <g>
    <use href="#maize" x="900"  y="618" width="24" height="70"/>
    <use href="#maize" x="960"  y="614" width="24" height="70"/>
    <use href="#maize" x="1020" y="610" width="24" height="70"/>
    <use href="#maize" x="1080" y="606" width="24" height="70"/>
    <use href="#maize" x="1140" y="602" width="24" height="70"/>
    <use href="#maize" x="1520" y="590" width="24" height="70"/>
    <use href="#maize" x="1580" y="592" width="24" height="70"/>
    <use href="#maize" x="1636" y="594" width="24" height="70"/>
    <use href="#maize" x="860"  y="660" width="34" height="100"/>
    <use href="#maize" x="940"  y="656" width="34" height="100"/>
    <use href="#maize" x="1020" y="652" width="34" height="100"/>
    <use href="#maize" x="1100" y="648" width="34" height="100"/>
    <use href="#maize" x="1520" y="636" width="34" height="100"/>
    <use href="#maize" x="1600" y="634" width="34" height="100"/>
    <use href="#maize" x="820"  y="716" width="44" height="130"/>
    <use href="#maize" x="920"  y="712" width="44" height="130"/>
    <use href="#maize" x="1020" y="708" width="44" height="130"/>
    <use href="#maize" x="1120" y="704" width="44" height="130"/>
    <use href="#maize" x="1560" y="694" width="44" height="130"/>
    <use href="#maize" x="760"  y="790" width="54" height="160"/>
    <use href="#maize" x="880"  y="786" width="54" height="160"/>
    <use href="#maize" x="1000" y="782" width="54" height="160"/>
    <use href="#maize" x="1600" y="770" width="54" height="160"/>
  </g>

  <!-- The farmer: wide hat, terracotta shirt, a hoe over the shoulder, and a phone showing the payout. -->
  <g transform="translate(1250 470)" filter="url(#shadow)">
    <!-- hoe -->
    <line x1="120" y1="-40" x2="20" y2="300" stroke="#8A5A33" stroke-width="9" stroke-linecap="round"/>
    <path d="M114 -44 L124 -36 L96 2 L84 -6 Z" fill="#9AA6B0"/>
    <!-- legs -->
    <path d="M40 300 L52 455 L80 455 L82 330 L96 455 L124 455 L128 300 Z" fill="#2D3B4A"/>
    <rect x="44" y="452" width="40" height="14" rx="6" fill="#1A232D"/>
    <rect x="94" y="452" width="40" height="14" rx="6" fill="#1A232D"/>
    <!-- body -->
    <path d="M30 150 C 30 120 50 104 84 104 C 118 104 138 120 138 150 L144 310 L24 310 Z" fill="#C96A43"/>
    <path d="M58 104 L84 140 L110 104 Z" fill="#E08A6A"/>
    <!-- arm holding the hoe -->
    <path d="M128 150 C 150 150 150 120 132 70 L118 74 C 128 112 126 136 112 148 Z" fill="#C96A43"/>
    <circle cx="125" cy="66" r="13" fill="#7A4A2E"/>
    <!-- arm holding the phone forward -->
    <path d="M36 158 C 10 186 -8 214 -30 236 L -16 250 C 4 228 28 206 52 186 Z" fill="#C96A43"/>
    <circle cx="-26" cy="244" r="13" fill="#7A4A2E"/>
    <!-- head and hat -->
    <rect x="72" y="88" width="24" height="22" fill="#7A4A2E"/>
    <ellipse cx="84" cy="70" rx="30" ry="34" fill="#7A4A2E"/>
    <ellipse cx="84" cy="44" rx="74" ry="14" fill="#E0C27A"/>
    <path d="M52 44 C 54 12 114 12 116 44 Z" fill="#D9B565"/>
    <rect x="54" y="34" width="60" height="8" fill="#8A5A33"/>
  </g>

  <!-- Phone with the payout notification. -->
  <g transform="translate(1166 628) rotate(-10) scale(0.56)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="250" rx="22" fill="#0B1726"/>
    <rect x="9" y="12" width="132" height="226" rx="15" fill="#FFFDF9"/>
    <path d="M75 46 C 82 58 92 66 92 76 A 17 17 0 1 1 58 76 C 58 66 68 58 75 46 Z" fill="url(#drop)"/>
    <text x="75" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="17" fill="#12324E">Payout sent</text>
    <circle cx="75" cy="168" r="22" fill="#2E9E5B"/>
    <path d="M64 168 L72 177 L88 159" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4A6075">Rain fell short</text>
  </g>

  <!-- Readability fade behind the text. -->
  <rect width="1672" height="941" fill="url(#fade)"/>

  <!-- Mvua Protocol logo lockup on a light badge, in its official colours. -->
  <g transform="translate(70 58)" filter="url(#shadow)">
    <rect x="0" y="0" width="398" height="78" rx="39" fill="#FBF7F0"/>
    <g transform="translate(22 12) scale(0.42)">
      <g transform="translate(12.3,4.0) scale(0.9833)"><path d="M60 18 C 74 40 94 58 94 76 A 34 34 0 1 1 26 76 C 26 58 46 40 60 18 Z" fill="url(#drop)"/><ellipse cx="47" cy="58" rx="7.5" ry="15" transform="rotate(-24 47 58)" fill="#FFFFFF" opacity="0.38"/></g><g transform="translate(160.3,31.0)"><path d="M857 702V0H686V421L529 0H391L233 422V0H62V702H264L461 216L656 702Z" transform="translate(0.000,65.120) translate(0.000,0) scale(0.08800,-0.08800)" fill="#12324E"/><path d="M313 160 434 558H616L418 0H207L9 558H192Z" transform="translate(0.000,65.120) translate(81.284,0) scale(0.08800,-0.08800)" fill="#12324E"/><path d="M613 558V0H442V76Q416 39 371.5 16.5Q327 -6 273 -6Q209 -6 160.0 22.5Q111 51 84.0 105.0Q57 159 57 232V558H227V255Q227 199 256.0 168.0Q285 137 334 137Q384 137 413.0 168.0Q442 199 442 255V558Z" transform="translate(0.000,65.120) translate(136.872,0) scale(0.08800,-0.08800)" fill="#12324E"/><path d="M274 566Q333 566 377.5 542.0Q422 518 446 479V558H617V0H446V79Q421 40 376.5 16.0Q332 -8 273 -8Q205 -8 149.0 27.5Q93 63 60.5 128.5Q28 194 28 280Q28 366 60.5 431.0Q93 496 149.0 531.0Q205 566 274 566ZM324 417Q273 417 237.5 380.5Q202 344 202 280Q202 216 237.5 178.5Q273 141 324 141Q375 141 410.5 178.0Q446 215 446 279Q446 343 410.5 380.0Q375 417 324 417Z" transform="translate(0.000,65.120) translate(196.684,0) scale(0.08800,-0.08800)" fill="#12324E"/><path d="M339 252H233V0H62V702H339Q423 702 481.0 673.0Q539 644 568.0 593.0Q597 542 597 476Q597 415 569.0 364.5Q541 314 483.0 283.0Q425 252 339 252ZM423 476Q423 518 399.0 541.0Q375 564 326 564H233V388H326Q375 388 399.0 411.0Q423 434 423 476Z" transform="translate(282.836,65.120) translate(0.000,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M408 564V383H361Q297 383 265.0 355.5Q233 328 233 259V0H62V558H233V465Q263 511 308.0 537.5Q353 564 408 564Z" transform="translate(282.836,65.120) translate(55.412,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M28 279Q28 365 66.0 430.5Q104 496 170.0 531.0Q236 566 318 566Q400 566 466.0 531.0Q532 496 570.0 430.5Q608 365 608 279Q608 193 569.5 127.5Q531 62 464.5 27.0Q398 -8 316 -8Q234 -8 168.5 27.0Q103 62 65.5 127.0Q28 192 28 279ZM434 279Q434 346 400.5 382.0Q367 418 318 418Q268 418 235.0 382.5Q202 347 202 279Q202 212 234.5 176.0Q267 140 316 140Q365 140 399.5 176.0Q434 212 434 279Z" transform="translate(282.836,65.120) translate(93.576,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M373 145V0H286Q193 0 141.0 45.5Q89 91 89 194V416H21V558H89V694H260V558H372V416H260V192Q260 167 272.0 156.0Q284 145 312 145Z" transform="translate(282.836,65.120) translate(150.132,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M28 279Q28 365 66.0 430.5Q104 496 170.0 531.0Q236 566 318 566Q400 566 466.0 531.0Q532 496 570.0 430.5Q608 365 608 279Q608 193 569.5 127.5Q531 62 464.5 27.0Q398 -8 316 -8Q234 -8 168.5 27.0Q103 62 65.5 127.0Q28 192 28 279ZM434 279Q434 346 400.5 382.0Q367 418 318 418Q268 418 235.0 382.5Q202 347 202 279Q202 212 234.5 176.0Q267 140 316 140Q365 140 399.5 176.0Q434 212 434 279Z" transform="translate(282.836,65.120) translate(186.360,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M308 566Q413 566 483.5 511.0Q554 456 576 356H394Q371 420 305 420Q258 420 230.0 383.5Q202 347 202 279Q202 211 230.0 174.5Q258 138 305 138Q371 138 394 202H576Q554 104 483.0 48.0Q412 -8 308 -8Q226 -8 162.5 27.0Q99 62 63.5 127.0Q28 192 28 279Q28 366 63.5 431.0Q99 496 162.5 531.0Q226 566 308 566Z" transform="translate(282.836,65.120) translate(242.916,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M28 279Q28 365 66.0 430.5Q104 496 170.0 531.0Q236 566 318 566Q400 566 466.0 531.0Q532 496 570.0 430.5Q608 365 608 279Q608 193 569.5 127.5Q531 62 464.5 27.0Q398 -8 316 -8Q234 -8 168.5 27.0Q103 62 65.5 127.0Q28 192 28 279ZM434 279Q434 346 400.5 382.0Q367 418 318 418Q268 418 235.0 382.5Q202 347 202 279Q202 212 234.5 176.0Q267 140 316 140Q365 140 399.5 176.0Q434 212 434 279Z" transform="translate(282.836,65.120) translate(296.656,0) scale(0.08800,-0.08800)" fill="#C96A43"/><path d="M233 740V0H62V740Z" transform="translate(282.836,65.120) translate(353.212,0) scale(0.08800,-0.08800)" fill="#C96A43"/></g>
    </g>
  </g>

  <!-- Title, in the blog's white plus yellow style. -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" filter="url(#shadow)">
    <text x="78" y="262" font-size="70" fill="#FFFFFF">Insurance That Pays</text>
    <text x="78" y="352" font-size="70" fill="#FFC93C">When the Rain Doesn't</text>
  </g>
  <text x="80" y="420" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#EAF2FA">Parametric weather insurance for farmers, on Stellar.</text>

  <!-- How it works, in three steps. -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="24" filter="url(#shadow)">
    <rect x="78" y="462" width="222" height="56" rx="28" fill="#0E4E7E" stroke="#5AB0E4" stroke-width="2"/>
    <text x="189" y="498" text-anchor="middle" fill="#FFFFFF">Signed rainfall</text>
    <path d="M312 490 L340 490 M330 480 L342 490 L330 500" stroke="#FFC93C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="354" y="462" width="222" height="56" rx="28" fill="#0E4E7E" stroke="#5AB0E4" stroke-width="2"/>
    <text x="465" y="498" text-anchor="middle" fill="#FFFFFF">On-chain index</text>
    <path d="M588 490 L616 490 M606 480 L618 490 L606 500" stroke="#FFC93C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="630" y="462" width="252" height="56" rx="28" fill="#2E9E5B" stroke="#8FE0B0" stroke-width="2"/>
    <text x="756" y="498" text-anchor="middle" fill="#FFFFFF">Automatic payout</text>
  </g>

  <!-- Blog address, bottom right, as on the other covers. -->
  <g transform="translate(1394 872)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="44" rx="22" fill="#06172A" opacity="0.85"/>
    <circle cx="24" cy="22" r="9" fill="#5AB0E4"/>
    <text x="42" y="30" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="20" fill="#FFFFFF">emeditweb.vercel.app</text>
  </g>
</svg>
